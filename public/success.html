<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order confirmed | Veryeo</title>
<meta name="description" content="Your Veryeo order confirmation.">
<meta name="robots" content="noindex">
<link rel="canonical" href="/success.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Veryeo">
<meta property="og:title" content="Order confirmed | Veryeo">
<meta property="og:description" content="Your Veryeo order confirmation.">
<meta property="og:image" content="/images/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f5f3ee">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="announce">Try a <b data-price="demo">$9</b> website demo first. It's credited toward your full site.</div>
<header class="top"><div class="wrap">
  <a class="logo" href="/"><i></i>veryeo</a>
  <nav class="nav" aria-label="Main">
    <a href="/#how">How it works</a><a href="/#pricing">Pricing</a><a href="/#work">Work</a><a href="/#faq">FAQ</a>
    <a class="btn primary sm" href="/#order" data-pick="demo">Get a demo</a>
  </nav>
</div></header>
<main>
<section class="page"><div class="wrap">
<span class="eyebrow">Order confirmation</span><h1 id="oTitle">Checking your order&hellip;</h1>
<div id="oBox" style="display:grid;gap:24px"></div>
<p style="margin-top:28px"><a class="btn" href="/">Back to home</a></p>
</div></section>
</main>
<footer class="foot"><div class="wrap">
  <div>&copy; <span data-year></span> Veryeo</div>
  <nav aria-label="Footer"><a href="/refunds.html">Refund policy</a><a href="/privacy.html">Privacy policy</a><a href="/terms.html">Terms of service</a><a href="/#contact">Contact</a></nav>
</div></footer>
<script src="/app.js"></script>
<script>
(async function(){
  const t=document.getElementById('oTitle'),box=document.getElementById('oBox');
  const id=new URLSearchParams(location.search).get('session_id');
  const add=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n};
  if(!id){t.textContent='No order found';box.appendChild(add('p',null,'If you just paid, check your email for a receipt.'));return}
  try{
    const r=await fetch('/api/order?session_id='+encodeURIComponent(id));const o=await r.json();
    if(!r.ok)throw new Error(o.error||'Order not found');
    const fmt=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:(o.currency||'usd').toUpperCase()}).format((v||0)/100);
    t.textContent=o.paid?('You\'re in'+(o.name?', '+o.name.split(' ')[0]:'')+'!'):'Payment processing';
    const card=add('div','receipt');
    card.appendChild(add('div',null,'Order #'+o.orderNumber));
    if(id.startsWith('cs_test_'))card.appendChild(add('span','tag-test','Test order, no real money charged'));
    o.items.forEach(i=>{const row=add('div','row');row.append(add('span',null,i.name+(o.business?' ('+o.business+')':'')),add('span',null,fmt(i.amount)));card.appendChild(row)});
    if(o.discount){const d=add('div','row');d.append(add('span',null,'Demo credit'),add('span',null,'-'+fmt(o.discount)));card.appendChild(d)}
    const tot=add('div','row tot');tot.append(add('span',null,'Total paid'),add('span',null,fmt(o.total)));card.appendChild(tot);
    box.appendChild(card);
    const h=add('h2',null,'What happens next');box.appendChild(h);
    const ol=add('ol','next');
    const turn=(window.Site&&Site.get()&&Site.get().turnaround)||'within 3 business days';
    const steps=o.plan==='website'
      ?['We email you'+(o.email?' at '+o.email:'')+' to collect your text, logo and photos.','We build your site and deliver it '+turn+' after we have your content.','You review it, request up to 2 rounds of changes, and we launch it.']
      :['We start designing your homepage from the details you sent.','We email your private preview link'+(o.email?' to '+o.email:'')+' '+turn+'.','Love it? Buy the full website with the code in that email for your demo credit.'];
    steps.forEach(s=>ol.appendChild(add('li',null,s)));box.appendChild(ol);
  }catch(e){t.textContent='We could not load your order';box.appendChild(add('p',null,'Your payment may still have gone through. Check your email for a receipt or contact us.'))}
})();
</script>
</body>
</html>
